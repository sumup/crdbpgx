version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/crdbotel"
      - "/crdbprom"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      otel:
        patterns:
          - "go.opentelemetry.io/*"
